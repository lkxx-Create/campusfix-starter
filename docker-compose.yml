services:
  app:
    build: .
    image: campusfix:latest
    container_name: campusfix-app
    ports:
      # 只绑本机：Docker 发布端口会绕过 UFW，写 0.0.0.0 等于把 5000 暴露到公网
      # 对外统一走 Nginx(80) → 127.0.0.1:5000
      - "127.0.0.1:5000:5000"
    environment:
      # 生产模式：关掉 Flask 调试与自动重载
      FLASK_DEBUG: "0"
    volumes:
      # 命名卷挂到 /app/instance：数据库落在卷里，容器删了数据还在
      - campusfix-data:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  campusfix-data:
