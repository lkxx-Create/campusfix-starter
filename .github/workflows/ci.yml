name: CI

# 课18：push 与 PR 都触发，PR 页面直接显示 CI 状态（红了不能合并）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 跑测试
        run: pytest
      - name: 使用Secret
        run: echo "token长度=${#TEST_TOKEN}"
        env:
          TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
